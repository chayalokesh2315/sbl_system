{% extends "base.html" %}
{% block title %}Users - SBL System{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-people-fill"></i> User Management</h3>
<div class="card sbl-card">
  <div class="table-responsive">
    <table class="table table-hover mb-0">
      <thead class="table-light">
        <tr><th>Username</th><th>Email</th><th>Role</th><th>Joined</th><th></th></tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr>
          <td>{{ u['username'] }}</td>
          <td>{{ u['email'] }}</td>
          <td>{{ u['role'] }}</td>
          <td>{{ u['created_at'] }}</td>
          <td>
            <form method="post" action="{{ url_for('auth.change_role', user_id=u['id']) }}" class="d-flex gap-2">
              <select name="role" class="form-select form-select-sm">
                {% for r in roles %}
                  <option value="{{ r }}" {% if r == u['role'] %}selected{% endif %}>{{ r }}</option>
                {% endfor %}
              </select>
              <button class="btn btn-sm btn-outline-primary">Update</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
