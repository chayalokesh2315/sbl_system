{% extends "base.html" %}
{% block title %}Scan Project - SBL System{% endblock %}
{% block content %}
<h3 class="mb-1">Scan Project</h3>
<p class="text-muted">{{ project['name'] }}</p>
<div class="card sbl-card p-4" style="max-width: 600px;">
  <form method="post" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label">Project files (.zip)</label>
      <input type="file" name="project_zip" accept=".zip" class="form-control" required>
      <div class="form-text">The code is only read, never executed. Detected issues are added to this project as bugs. Max 50 MB.</div>
    </div>
    <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Upload &amp; Detect Bugs</button>
    <a href="{{ url_for('projects.detail', project_id=project['id']) }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
