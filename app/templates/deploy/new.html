{% extends "base.html" %}
{% block title %}Record Deployment - SBL System{% endblock %}
{% block content %}
<h3 class="mb-1">Record Deployment</h3>
<p class="text-muted mb-4">Release {{ release['version_number'] }} &middot; {{ release['project_name'] }}</p>
<div class="card sbl-card p-4" style="max-width: 600px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Environment</label>
      <select name="environment" class="form-select">
        {% for e in environments %}<option value="{{ e }}">{{ e }}</option>{% endfor %}
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Record Deployment &amp; Generate Verification Link</button>
  </form>
</div>
{% endblock %}
